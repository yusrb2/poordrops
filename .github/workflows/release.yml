name: Build and Release PoorDrops Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies and build web bundle
        run: |
          npm ci
          npm run typecheck
          npm run build
          npx cap sync android

      - name: Decode Android signing keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        working-directory: android
        env:
          POORDROPS_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && 'release.keystore' || '' }}
          POORDROPS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POORDROPS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          POORDROPS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apks
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/poordrops-${{ github.ref_name }}.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/poordrops-debug-${{ github.ref_name }}.apk
          fi

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: poordrops-android-apk
          path: release-apks/*.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-apks/*.apk \
            --title "PoorDrops ${{ github.ref_name }}" \
            --notes "Zero-server P2P file & clipboard transfer — AirDrop without the ecosystem tax." \
            --overwrite || gh release upload "${{ github.ref_name }}" release-apks/*.apk --clobber
